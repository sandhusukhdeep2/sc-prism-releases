<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="How one run works in SC Prism: you ask; a deterministic orchestrator staffs a crew with each seat on its own AI; every tool call passes your grant, the agent's own definition and a destructive-command denylist; the work is verified by your own tests at zero tokens before any AI judge; the result is a verdict with replayable hash-chained evidence. A privacy floor evaluated before every routing decision pins credential-bearing text to the local model.">
<defs><marker id="mdark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9198a1"/></marker></defs>
<rect width="900" height="400" fill="#0d1117"/>
<text x="28" y="34" font-size="16" font-weight="700" fill="#e6edf3">How one run works</text>
<text x="28" y="54" font-size="11.5" fill="#9198a1">Deterministic code chairs the run. The model that did the work never decides whether it is done.</text>
<rect x="28" y="76" width="150" height="66" rx="7" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="41" y="98" font-size="13" font-weight="600" fill="#e6edf3">You ask</text>
<text x="41" y="116" font-size="11" fill="#9198a1">a task, in your</text>
<text x="41" y="131" font-size="11" fill="#9198a1">own words</text>
<line x1="178" y1="109" x2="214" y2="109" stroke="#9198a1" stroke-width="1.4" marker-end="url(#mdark)"/>
<rect x="222" y="76" width="168" height="66" rx="7" fill="#151b23" stroke="#e6edf3" stroke-width="1.6"/>
<text x="235" y="98" font-size="13" font-weight="600" fill="#e6edf3">Orchestrator</text>
<text x="235" y="116" font-size="11" fill="#9198a1">staffs the crew,</text>
<text x="235" y="131" font-size="11" fill="#9198a1">chairs every turn</text>
<line x1="390" y1="109" x2="426" y2="109" stroke="#9198a1" stroke-width="1.4" marker-end="url(#mdark)"/>
<rect x="434" y="68" width="190" height="26" rx="7" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="447" y="90" font-size="13" font-weight="600" fill="#e6edf3">Researcher · Claude</text>
<rect x="434" y="98" width="190" height="26" rx="7" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="447" y="120" font-size="13" font-weight="600" fill="#e6edf3">Analyst · local model</text>
<rect x="434" y="128" width="190" height="26" rx="7" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="447" y="150" font-size="13" font-weight="600" fill="#e6edf3">Critic · Gemini</text>
<text x="434" y="172" font-size="10.5" fill="#9198a1">one shared board · each seat on its own AI</text>
<path d="M 434 141 L 412 141 L 412 196 L 122 196 L 122 218" fill="none" stroke="#9198a1" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#mdark)"/>
<rect x="28" y="226" width="190" height="92" rx="7" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="41" y="248" font-size="13" font-weight="600" fill="#e6edf3">Every tool call</text>
<text x="41" y="266" font-size="11" fill="#9198a1">1 · your grant</text>
<text x="41" y="281" font-size="11" fill="#9198a1">2 · the agent's own file</text>
<text x="41" y="296" font-size="11" fill="#9198a1">3 · destructive denylist</text>
<line x1="218" y1="272" x2="254" y2="272" stroke="#9198a1" stroke-width="1.4" marker-end="url(#mdark)"/>
<rect x="262" y="226" width="190" height="92" rx="7" fill="#151b23" stroke="#e6edf3" stroke-width="1.6"/>
<text x="275" y="248" font-size="13" font-weight="600" fill="#e6edf3">Verified</text>
<text x="275" y="266" font-size="11" fill="#9198a1">Tier 1 — your own tests,</text>
<text x="275" y="281" font-size="11" fill="#9198a1">at zero tokens</text>
<text x="275" y="296" font-size="11" fill="#9198a1">then, only then, a judge</text>
<line x1="452" y1="272" x2="488" y2="272" stroke="#9198a1" stroke-width="1.4" marker-end="url(#mdark)"/>
<rect x="496" y="226" width="190" height="92" rx="7" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
<text x="509" y="248" font-size="13" font-weight="600" fill="#e6edf3">Verdict</text>
<text x="509" y="266" font-size="11" fill="#9198a1">pass or fail, the reason,</text>
<text x="509" y="281" font-size="11" fill="#9198a1">and hash-chained</text>
<text x="509" y="296" font-size="11" fill="#9198a1">evidence you can replay</text>
<rect x="28" y="336" width="844" height="44" rx="7" fill="#151b23" stroke="#3d444d" stroke-dasharray="4 3"/>
<text x="42" y="356" font-size="11.5" font-weight="600" fill="#e6edf3">Privacy floor — evaluated before every routing decision</text>
<text x="42" y="372" font-size="10.5" fill="#9198a1">Text carrying a credential is pinned to your local model and cannot reach the cloud, even when you ask it to.</text>
</svg>